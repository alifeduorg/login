<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(145deg, #0c1a3e, #102050);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .login-box {
        background: #0d1b3d;
        border-radius: 20px;
        box-shadow: 5px 5px 20px #09132e, -5px -5px 20px #122850;
        padding: 40px;
        width: 350px;
        text-align: center;
        position: relative;
      }

      .login-box h2 {
        color: #ffd700;
        margin-bottom: 20px;
      }

      .login-box input, .login-box select {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: none;
        border-radius: 8px;
        background: #eaeaea;
      }

      .login-box button {
        width: 100%;
        padding: 12px;
        background: #ffd700;
        border: none;
        border-radius: 8px;
        color: #0c1a3e;
        font-weight: bold;
        cursor: pointer;
      }

      .logo {
        width: 80px;
        margin-bottom: 10px;
      }

      .footer {
        margin-top: 20px;
        font-size: 12px;
        color: #ccc;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <img src="LOGO_URL_HERE" class="logo" alt="Logo">
      <h2>Login</h2>
      <input type="text" id="staffId" placeholder="Staff ID">
      <input type="password" id="password" placeholder="Password">
      <select id="role">
        <option value="">Select Role</option>
        <option value="admin">Admin</option>
        <option value="mentor">Mentor</option>
        <option value="teacher">Teacher</option>
      </select>
      <button onclick="login()">Login</button>
      <div class="footer">Powered by Alif Edu</div>
    </div>

    <script>
      function login() {
        const staffId = document.getElementById("staffId").value;
        const password = document.getElementById("password").value;
        const role = document.getElementById("role").value;

        google.script.run.withSuccessHandler(function(response) {
          if (response.status === "success") {
            window.location.href = response.url;
          } else {
            alert("Invalid login credentials!");
          }
        }).checkLogin(staffId, password, role);
      }
    </script>
  </body>
</html>
